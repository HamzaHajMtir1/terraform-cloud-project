name: Terraform

# Pull Request : qualité + plan dev publié sur la PR
# Push sur main : qualité + plan dev (apply dev seulement si AUTO_APPLY_DEV = true)
# Manuel (workflow_dispatch) : plan / apply / destroy sur dev, test ou prod
#   -> test et prod passent par un GitHub Environment avec validation manuelle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [dev, test, prod]
        default: dev
      action:
        description: Action
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  TARGET_ENV: ${{ inputs.environment || 'dev' }}

# Un seul déploiement à la fois par environnement
concurrency:
  group: terraform-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  quality:
    name: Qualite (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform validate (bootstrap + 3 environnements)
        run: |
          for dir in bootstrap environments/dev environments/test environments/prod; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  plan:
    name: Plan (${{ inputs.environment || 'dev' }})
    needs: quality
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/${{ inputs.environment || 'dev' }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Learner Lab interdit la fédération OIDC : identifiants temporaires
      # stockés dans les secrets GitHub (masqués dans les journaux)
      - name: Authentification AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Publier le plan dans le résumé du pipeline
        run: |
          {
            echo "## Terraform plan : \`${TARGET_ENV}\`"
            echo '```hcl'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conserver le plan (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: |
            environments/${{ env.TARGET_ENV }}/tfplan
            environments/${{ env.TARGET_ENV }}/plan.txt
          retention-days: 1

      - name: Commenter la Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(`environments/${process.env.TARGET_ENV}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.substring(0, 60000) + '\n... (plan tronqué)';
            const body = [
              `### Terraform plan : \`${process.env.TARGET_ENV}\``,
              '<details><summary>Afficher le plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  apply:
    name: Apply (${{ inputs.environment || 'dev' }})
    needs: plan
    # Jamais depuis une branche non protégée ; dev automatique seulement si activé
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') ||
        (github.event_name == 'push' && vars.AUTO_APPLY_DEV == 'true')
      )
    runs-on: ubuntu-latest
    # Environment GitHub : "Required reviewers" configurés pour test et prod
    environment: ${{ inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: environments/${{ inputs.environment || 'dev' }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authentification AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Récupérer le plan validé
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: environments/${{ env.TARGET_ENV }}

      - name: terraform init
        run: terraform init

      - name: terraform apply (plan validé uniquement)
        run: terraform apply tfplan

      - name: URL de l'application
        run: |
          echo "### Application : $(terraform output -raw alb_url)" >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy (${{ inputs.environment }})
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authentification AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init

      - name: terraform destroy
        run: terraform destroy -auto-approve
